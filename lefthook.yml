pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{ts,tsx,js,json,md,yml,yaml,css,html}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{ts,tsx,js}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    check:
      run: pnpm check
