<html lang="<!--site-lang-->">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Google Search Console ownership (docs/architecture.md → Public site). -->
    <meta name="google-site-verification" content="6eG5U9Q7FdDeP7xiCp4krLDj3YSL4qZr7lsPK48ABT8" />
    <!--site-head-->
    <script>
      // The installed app (PWA) opens the app, not the public home page, even when it was installed
      // before the app moved to /app.
      if (
        location.pathname === '/' &&
        (matchMedia('(display-mode: standalone)').matches || navigator.standalone)
      ) {
        location.replace('/app');
      }
    </script>
  </head>
  <body>
    <div id="root"><!--site-html--></div>
    <script type="module" src="/src/site/entry-client.tsx"></script>
  </body>
